<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Склад CargoFlow</title>
  <desc id="heroDesc">Иллюстрация стеллажей с коробками и карточкой состояния склада</desc>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <circle cx="430" cy="280" r="245" fill="#2dd4bf" opacity=".13" filter="url(#glow)"/>
  <ellipse cx="410" cy="548" rx="315" ry="42" fill="#020617" opacity=".42"/>

  <!-- Стеллаж -->
  <g filter="url(#soft)">
    <rect x="145" y="128" width="18" height="392" rx="7" fill="url(#steel)"/>
    <rect x="615" y="128" width="18" height="392" rx="7" fill="url(#steel)"/>
    <rect x="145" y="128" width="488" height="16" rx="8" fill="url(#steel)"/>
    <rect x="145" y="276" width="488" height="14" rx="7" fill="url(#steel)"/>
    <rect x="145" y="418" width="488" height="14" rx="7" fill="url(#steel)"/>
    <rect x="151" y="500" width="476" height="12" rx="6" fill="#1e293b"/>

    <!-- Верхняя полка -->
    <g>
      <rect x="188" y="168" width="112" height="108" rx="12" fill="url(#amber)"/>
      <rect x="231" y="168" width="22" height="108" fill="#fff7ed" opacity=".35"/>
      <rect x="205" y="200" width="54" height="8" rx="4" fill="#78350f" opacity=".55"/>
      <rect x="205" y="218" width="36" height="6" rx="3" fill="#78350f" opacity=".35"/>

      <rect x="312" y="188" width="126" height="88" rx="12" fill="url(#teal)"/>
      <rect x="360" y="188" width="24" height="88" fill="#ecfeff" opacity=".3"/>
      <path d="m330 226 18 18 32-38" fill="none" stroke="#ecfeff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="450" y="160" width="138" height="116" rx="12" fill="url(#mint)"/>
      <rect x="501" y="160" width="24" height="116" fill="#0f766e" opacity=".18"/>
      <rect x="470" y="196" width="68" height="8" rx="4" fill="#0f766e" opacity=".45"/>
      <rect x="470" y="214" width="44" height="7" rx="3.5" fill="#0f766e" opacity=".3"/>
      <circle cx="550" cy="246" r="14" fill="#0f766e" opacity=".22"/>
    </g>

    <!-- Средняя полка -->
    <g>
      <rect x="180" y="306" width="146" height="112" rx="12" fill="url(#mint)"/>
      <rect x="236" y="306" width="26" height="112" fill="#0f766e" opacity=".2"/>
      <rect x="202" y="342" width="74" height="9" rx="4.5" fill="#0f766e" opacity=".48"/>
      <rect x="202" y="361" width="48" height="7" rx="3.5" fill="#0f766e" opacity=".3"/>

      <rect x="338" y="322" width="104" height="96" rx="12" fill="url(#amber)"/>
      <rect x="379" y="322" width="22" height="96" fill="#fff7ed" opacity=".35"/>
      <rect x="356" y="352" width="46" height="7" rx="3.5" fill="#78350f" opacity=".5"/>

      <rect x="456" y="300" width="132" height="118" rx="12" fill="url(#teal)"/>
      <rect x="506" y="300" width="24" height="118" fill="#ecfeff" opacity=".3"/>
      <path d="M478 350h88M478 370h62" stroke="#ecfeff" stroke-width="8" stroke-linecap="round" opacity=".65"/>
    </g>

    <!-- Нижний ярус -->
    <g>
      <rect x="182" y="452" width="420" height="20" rx="5" fill="#8b5e34"/>
      <rect x="202" y="472" width="22" height="26" rx="4" fill="#6b4226"/>
      <rect x="560" y="472" width="22" height="26" rx="4" fill="#6b4226"/>
      <rect x="196" y="458" width="92" height="0" fill="none"/>
      <rect x="197" y="432" width="86" height="22" rx="6" fill="#f59e0b" opacity=".75"/>
      <rect x="294" y="420" width="120" height="32" rx="8" fill="#0f766e" opacity=".8"/>
      <rect x="426" y="436" width="74" height="16" rx="4" fill="#e2e8f0" opacity=".7"/>
      <rect x="512" y="428" width="76" height="24" rx="6" fill="#fcd34d" opacity=".8"/>
    </g>
  </g>

  <!-- Плавающая карточка статуса -->
  <g filter="url(#soft)">
    <rect x="470" y="92" width="238" height="108" rx="24" fill="#0b1220" opacity=".92"/>
    <rect x="470" y="92" width="238" height="108" rx="24" fill="url(#glass)"/>
    <rect x="470" y="92" width="238" height="108" rx="24" fill="none" stroke="#5eead4" stroke-opacity=".35"/>
    <circle cx="512" cy="130" r="19" fill="#0f766e"/>
    <path d="m503 130 6 6 12-13" fill="none" stroke="#ccfbf1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="542" y="126" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Склад в норме</text>
    <text x="542" y="148" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">все позиции учтены</text>
    <rect x="498" y="168" width="174" height="8" rx="4" fill="#1e293b"/>
    <rect x="498" y="168" width="140" height="8" rx="4" fill="#2dd4bf"/>
  </g>

  <!-- Плавающий бейдж -->
  <g filter="url(#soft)">
    <rect x="118" y="352" width="156" height="60" rx="18" fill="#fbbf24"/>
    <rect x="134" y="371" width="26" height="22" rx="4" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M134 378h26m-13 0v15" stroke="#1f2937" stroke-width="3"/>
    <text x="172" y="379" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">CargoFlow</text>
    <text x="172" y="397" fill="#78350f" font-family="Segoe UI, Arial, sans-serif" font-size="12">умный учёт грузов</text>
  </g>

  <!-- Декоративные элементы -->
  <circle cx="92" cy="214" r="5" fill="#5eead4" opacity=".65"/>
  <circle cx="712" cy="264" r="7" fill="#fbbf24" opacity=".7"/>
  <circle cx="680" cy="188" r="3.5" fill="#5eead4" opacity=".55"/>
  <path d="M90 430h44M112 408v44" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity=".28"/>
</svg>
